<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
<title>HostelCare - Log in</title></head>
<body><div id="root"></div>
<script src="/app.js"></script>
<script>
// Login page
if (localStorage.getItem('token')) location.href = '/dashboard.html';
let role = 'resident';
const ROLE_ICON = { resident: 'home', staff: 'tool', admin: 'shield' };

function draw() {
  $('#root').innerHTML = `<div class="lg"><div class="box">${LOGO}
    <p class="sub">Choose your role, then log in.</p>
    <div class="roles">${['resident', 'staff', 'admin'].map(r => `<div class="role ${r === role ? 'on' : ''}" onclick="pick('${r}')"><b>${ic(ROLE_ICON[r], 30)}</b><span>${r[0].toUpperCase() + r.slice(1)}</span></div>`).join('')}</div>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="er"></div>
    <button class="btn full" id="go" onclick="doLogin()">${ic('key', 16)} Log in</button>
    ${role === 'resident' ? '<div class="lnk" onclick="location.href=\'/signup.html\'">New resident? Create an account</div>' : '<div class="hint">Staff accounts are created by the admin.</div>'}
  </div></div>`;
}
function pick(r) { const e = $('#em').value; role = r; draw(); $('#em').value = e; }
async function doLogin() {
  try {
    saveSession(await api('/login', 'POST', { email: $('#em').value, password: $('#pw').value, role }));
    location.href = '/dashboard.html';
  } catch (e) { $('#er').textContent = e.message; }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('#pw')) doLogin(); });
draw();
</script></body></html>
